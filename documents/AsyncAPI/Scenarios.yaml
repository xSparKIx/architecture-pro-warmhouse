asyncapi: 2.6.0
info:
  title: API пользовательских сценариев
  version: 1.0.0
  description: |
    Асинхронный API для управления пользовательскими сценариями умного дома.
    Основные взаимодействия через брокер сообщений Kafka.

servers:
  kafka-server:
    url: kafka://kafka.example.com
    protocol: kafka
    description: Основной Kafka-кластер
    security:
      - saslScram: []

defaultContentType: application/json

channels:
  scenarios.commands:
    publish:
      operationId: executeScenario
      summary: Запуск пользовательского сценария
      message:
        $ref: '#/components/messages/ScenarioCommand'
    
    subscribe:
      operationId: receiveScenarioStatus
      summary: Получение статуса выполнения сценария
      message:
        $ref: '#/components/messages/ScenarioStatus'

  scenarios.events:
    subscribe:
      operationId: receiveScenarioEvents
      summary: События сценариев
      message:
        $ref: '#/components/messages/ScenarioEvent'

  scenarios.triggers:
    subscribe:
      operationId: receiveTriggers
      summary: Триггеры для запуска сценариев
      message:
        $ref: '#/components/messages/ScenarioTrigger'

components:
  messages:
    ScenarioCommand:
      name: scenarioCommand
      title: Команда выполнения сценария
      summary: Сообщение для запуска пользовательского сценария
      payload:
        $ref: '#/components/schemas/ScenarioCommand'
      headers:
        type: object
        properties:
          correlationId:
            type: string
          initiatedBy:
            type: string
            enum: [user, schedule, device, system]

    ScenarioStatus:
      name: scenarioStatus
      title: Статус сценария
      payload:
        $ref: '#/components/schemas/ScenarioStatus'

    ScenarioEvent:
      name: scenarioEvent
      title: Событие сценария
      payload:
        $ref: '#/components/schemas/ScenarioEvent'

    ScenarioTrigger:
      name: scenarioTrigger
      title: Триггер сценария
      payload:
        $ref: '#/components/schemas/ScenarioTrigger'

  schemas:
    # Основные схемы
    ScenarioCommand:
      type: object
      properties:
        scenarioId:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
        parameters:
          type: object
      required: [scenarioId, executionId]

    ScenarioStatus:
      type: object
      properties:
        executionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        timestamp:
          type: string
          format: date-time
      required: [executionId, status, timestamp]

    # Схемы событий
    ScenarioEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        scenarioId:
          type: string
          format: uuid
        type:
          type: string
          enum: [created, updated, deleted]
        timestamp:
          type: string
          format: date-time
      required: [eventId, scenarioId, type, timestamp]

    ScenarioTrigger:
      type: object
      properties:
        triggerId:
          type: string
          format: uuid
        scenarioId:
          type: string
          format: uuid
        triggerType:
          type: string
          enum: [schedule, device_event, manual]
        triggerData:
          type: object
      required: [triggerId, scenarioId, triggerType]

  securitySchemes:
    saslScram:
      type: scramSha256
      description: SASL SCRAM-SHA-256 аутентификация